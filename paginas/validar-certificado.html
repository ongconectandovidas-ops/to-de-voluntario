<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <title>Validar certificado | Tô de Voluntário</title>
    <link rel="icon" type="image/png" href="/assets/img/logo.png">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="preconnect" href="https://xeokfqlkhrynxzldwvup.supabase.co" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>

    <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

    <header>
        <nav class="navbar menu" aria-label="Navegação principal">
            <div class="container">
                <a class="navbar-brand" href="/index.html"><img src="/assets/img/logo.png" alt="" class="logo-marca"> Tô de Voluntário</a>
            </div>
        </nav>
    </header>

    <main id="conteudo-principal" class="container py-5" style="max-width: 640px;">

        <h1 class="h3 mb-2">Validar certificado</h1>
        <p class="mb-4">Digite o código de 6 caracteres que aparece no rodapé do certificado.</p>

        <form id="formValidar" class="d-flex gap-2 mb-4">
            <label for="codigo" class="visually-hidden">Código de verificação</label>
            <input type="text" id="codigo" class="form-control" placeholder="Ex.: K7M2QX" maxlength="6"
                   autocomplete="off" spellcheck="false" style="text-transform: uppercase; letter-spacing: 0.2em;" required>
            <button type="submit" id="botaoValidar" class="btn btn-primary">Validar</button>
        </form>

        <div id="resultado" role="status" aria-live="polite"></div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../assets/js/supabase-client.js"></script>
    <script src="../assets/js/acessibilidade.js"></script>

    <script>
    const formValidar = document.getElementById("formValidar");
    const campoCodigo = document.getElementById("codigo");
    const botaoValidar = document.getElementById("botaoValidar");
    const resultado = document.getElementById("resultado");
    const CODIGO = /^[A-Z0-9]{6}$/;

    function mostrar(tipo, titulo, linhas) {
        resultado.innerHTML = "";
        const caixa = document.createElement("div");
        caixa.className = "alert alert-" + tipo;

        const h = document.createElement("h2");
        h.className = "h5";
        h.textContent = titulo;
        caixa.appendChild(h);

        (linhas || []).forEach(function (texto) {
            const p = document.createElement("p");
            p.className = "mb-1";
            p.textContent = texto;
            caixa.appendChild(p);
        });

        resultado.appendChild(caixa);
    }

    async function validar(codigo) {
        codigo = codigo.toUpperCase();

        if (!CODIGO.test(codigo)) {
            mostrar("warning", "Código inválido", ["O código tem 6 caracteres (letras e números)."]);
            return;
        }

        botaoValidar.disabled = true;
        botaoValidar.textContent = "Validando...";

        try {
            const { data, error } = await supabaseClient.rpc("validar_certificado", { p_codigo: codigo });

            if (error) {
                mostrar("danger", "Não foi possível validar agora", ["Tente novamente em instantes."]);
                return;
            }

            if (!data || data.length === 0) {
                mostrar("danger", "Certificado não encontrado", ["Nenhum certificado válido com esse código."]);
                return;
            }

            const c = data[0];
            mostrar("success", "Certificado válido", [
                "Voluntário(a): " + c.nome,
                "Ação: " + c.oportunidade,
                "Organização: " + c.organizacao,
                "Concluída em: " + new Date(c.concluida_em).toLocaleDateString("pt-BR", { year: "numeric", month: "long", day: "numeric" })
            ]);
        } finally {
            botaoValidar.disabled = false;
            botaoValidar.textContent = "Validar";
        }
    }

    formValidar.addEventListener("submit", function (evento) {
        evento.preventDefault();
        validar(campoCodigo.value.trim());
    });

    // Link do rodapé do certificado: /documento/validar?codigo=...
    const codigoDaUrl = new URLSearchParams(window.location.search).get("codigo");

    if (codigoDaUrl) {
        campoCodigo.value = codigoDaUrl;
        validar(codigoDaUrl.trim());
    }
    </script>

</body>
</html>
