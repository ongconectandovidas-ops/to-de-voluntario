    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <title>Detalhes da oportunidade | Tô de Voluntário</title>

    <link rel="stylesheet" href="../assets/css/style.css">

</head>

<body>

    <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

    <!-- MENU -->

    <header>

        <nav class="menu" aria-label="Navegação principal">

            <div class="menu-toggle" role="button" tabindex="0" aria-label="Abrir menu de configurações">
                <i class="bi bi-list" aria-hidden="true"></i>
            </div>

            <a href="../index.html">Home</a>
            <a href="oportunidades.html">Oportunidades</a>
            <a href="sobre.html">Sobre</a>
            <a href="doacoes.html">Doações</a>
            <a href="contato.html">Contato</a>
            <a href="entrar.html">Entrar</a>

        </nav>

    </header>

    <div class="sidebar-lateral">

        <div class="top-sidebar">

            <h2>Configurações</h2>

            <span class="fechar-sidebar" role="button" tabindex="0" aria-label="Fechar menu de configurações">
                <i class="bi bi-x-lg" aria-hidden="true"></i>
            </span>

        </div>

        <div class="links-sidebar">

            <a href="configuracoes.html">
                <i class="bi bi-person-fill" aria-hidden="true"></i> Meu perfil
            </a>

            <a href="#" id="botaoSairSidebar">
                <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Sair
            </a>

        </div>

    </div>

    <!-- DETALHES -->

    <section class="formulario-voluntario" id="conteudo-principal" tabindex="-1">

        <div class="topo-formulario">

            <span id="detalheCausa">
                Oportunidade
            </span>

            <h1 id="detalheTitulo">
                Carregando...
            </h1>

            <p id="detalheOrganizacao"></p>

        </div>

        <div id="detalheConteudo" class="card-oportunidade" style="max-width: 800px; margin: 0 auto;">

            <p class="texto-ajuda">Carregando detalhes...</p>

        </div>

    </section>

    <script src="../assets/js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../assets/js/supabase-client.js"></script>
    <script src="../assets/js/acessibilidade.js"></script>

    <script>

    // ========================================
    // DETALHES DA OPORTUNIDADE
    // ========================================

    async function carregarDetalhesOportunidade() {
        const container = document.getElementById("detalheConteudo");
        const id = new URLSearchParams(window.location.search).get("id");

        if (!id || !supabaseClient) {
            container.innerHTML = '<p class="texto-ajuda">Oportunidade não encontrada.</p>';
            return;
        }

        const { data: op, error } = await supabaseClient
            .from("oportunidades")
            .select(`
                titulo, descricao, cidade, estado, modalidade, periodo, dias_atuacao, vagas_disponiveis,
                causas(nome),
                organizacoes(nome_fantasia, descricao, cidade, estado, site),
                oportunidade_habilidades(habilidades(nome))
            `)
            .eq("id", id)
            .single();

        if (error || !op) {
            container.innerHTML = '<p class="texto-ajuda">Não foi possível carregar essa oportunidade. Ela pode ter sido removida.</p>';
            return;
        }

        document.title = op.titulo + " | Tô de Voluntário";
        document.getElementById("detalheCausa").textContent = op.causas ? op.causas.nome : "Oportunidade";
        document.getElementById("detalheTitulo").textContent = op.titulo;
        document.getElementById("detalheOrganizacao").textContent = op.organizacoes ? "Publicada por " + op.organizacoes.nome_fantasia : "";

        container.innerHTML = "";

        const descricao = document.createElement("p");
        descricao.textContent = op.descricao;
        container.appendChild(descricao);

        const detalhesRapidos = document.createElement("div");
        detalhesRapidos.className = "botoes-card";

        const tipo = document.createElement("span");
        tipo.className = op.modalidade === "virtual" ? "tipo online" : "tipo";
        tipo.textContent = textoModalidade(op.modalidade);
        detalhesRapidos.appendChild(tipo);

        container.appendChild(detalhesRapidos);

        const local = document.createElement("p");
        local.className = "cidade";
        local.innerHTML = '<i class="bi bi-geo-alt-fill" aria-hidden="true"></i> ';
        local.append(textoLocalOportunidade(op));
        container.appendChild(local);

        if (op.periodo) {
            const periodo = document.createElement("p");
            periodo.innerHTML = '<i class="bi bi-clock-fill" aria-hidden="true"></i> Período: ' + op.periodo;
            container.appendChild(periodo);
        }

        if (op.dias_atuacao) {
            const dias = document.createElement("p");
            const rotulosDias = {
                segunda_a_sexta: "Segunda a sexta",
                fins_de_semana: "Finais de semana",
                todos_os_dias: "Todos os dias"
            };
            dias.innerHTML = '<i class="bi bi-calendar-week-fill" aria-hidden="true"></i> Dias: ' + (rotulosDias[op.dias_atuacao] || op.dias_atuacao);
            container.appendChild(dias);
        }

        const vagas = document.createElement("p");
        vagas.innerHTML = '<i class="bi bi-people-fill" aria-hidden="true"></i> ' + op.vagas_disponiveis + " vaga(s) disponível(is)";
        container.appendChild(vagas);

        const habilidades = (op.oportunidade_habilidades || []).map(function (item) {
            return item.habilidades ? item.habilidades.nome : null;
        }).filter(Boolean);

        if (habilidades.length > 0) {
            const tituloHabilidades = document.createElement("h3");
            tituloHabilidades.textContent = "Habilidades desejadas";
            container.appendChild(tituloHabilidades);

            const listaHabilidades = document.createElement("p");
            listaHabilidades.textContent = habilidades.join(", ");
            container.appendChild(listaHabilidades);
        }

        if (op.organizacoes && op.organizacoes.descricao) {
            const tituloOrg = document.createElement("h3");
            tituloOrg.textContent = "Sobre " + op.organizacoes.nome_fantasia;
            container.appendChild(tituloOrg);

            const descricaoOrg = document.createElement("p");
            descricaoOrg.textContent = op.organizacoes.descricao;
            container.appendChild(descricaoOrg);
        }

        const botoes = document.createElement("div");
        botoes.className = "botoes-card";
        botoes.appendChild(criarBotaoParticipar(id));
        container.appendChild(botoes);
    }

    carregarDetalhesOportunidade();

    </script>

</body>
</html>
